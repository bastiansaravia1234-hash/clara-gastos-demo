name: Clara checks
on: [push, pull_request]
jobs:
  planner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check assets/index-planner-6a865c66.js
      - run: node --check features/planner.mjs
      - run: node --check assets/index-rose-v2.js
      - run: node --check features/start-v2.mjs
      - run: node --check features/movements-v2.mjs
      - run: node --test tests/*.test.mjs
